<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330">
<defs>
<linearGradient id="ab-line" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<linearGradient id="ab-bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<pattern id="ab-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#fff" fill-opacity="0.06"/></pattern>
<style>
.ab-f{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.ab-m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
.ab-blink{animation:ab-bl 1s steps(2,end) infinite}
@keyframes ab-bl{50%{opacity:0}}
.ab-row{opacity:0;animation:ab-in .8s both}
@keyframes ab-in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
.ab-s{opacity:0}
.ab-s1{animation:ab-sl 12s infinite 0s}
.ab-s2{animation:ab-sl 12s infinite 4s}
.ab-s3{animation:ab-sl 12s infinite 8s}
@keyframes ab-sl{0%{opacity:0;transform:translateX(24px)}5%,30%{opacity:1;transform:translateX(0)}35%,100%{opacity:0;transform:translateX(-24px)}}
.ab-fill1{animation:ab-pr 4s linear infinite 0s;transform-origin:0 0;transform:scaleX(0)}
.ab-fill2{animation:ab-pr 4s linear infinite 0s;transform-origin:0 0;transform:scaleX(0)}
@keyframes ab-pr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ab-ring{stroke-dasharray:100;stroke-dashoffset:100;animation:ab-rg 4s linear infinite}
@keyframes ab-rg{0%{stroke-dashoffset:100}80%,100%{stroke-dashoffset:15}}
</style>
</defs>

<!-- LEFT: what I build -->
<g>
<rect x="0" y="0" width="440" height="330" rx="20" fill="#0d0e16"/>
<rect x="0" y="0" width="440" height="330" rx="20" fill="url(#ab-dots)"/>
<rect x="1" y="1" width="438" height="328" rx="19" fill="none" stroke="url(#ab-line)" stroke-opacity="0.65"/>
<rect x="24" y="22" width="392" height="34" rx="9" fill="#1b1d2e"/>
<circle cx="42" cy="39" r="5" fill="#ef4444"/><circle cx="59" cy="39" r="5" fill="#fbbf24"/><circle cx="76" cy="39" r="5" fill="#34d399"/>
<rect x="96" y="30" width="300" height="18" rx="9" fill="#0d0e16"/>
<text x="110" y="43" font-size="11" class="ab-m" fill="#94a3b8">https://zain.dev/what-i-build</text>
<text x="24" y="92" font-size="12" class="ab-m" fill="#22d3ee">// what I build</text>
<text x="24" y="120" font-size="22" font-weight="700" class="ab-f" fill="#f1f5f9">Products people actually use<tspan class="ab-blink" fill="#f472b6">_</tspan></text>

<g class="ab-f">
<g class="ab-row" style="animation-delay:.4s">
<rect x="24" y="142" width="392" height="52" rx="12" fill="#151726" stroke="#22d3ee" stroke-opacity="0.35"/>
<rect x="38" y="154" width="28" height="28" rx="8" fill="#22d3ee" fill-opacity="0.18"/>
<text x="46" y="174" font-size="15" fill="#22d3ee" class="ab-m">&lt;/&gt;</text>
<text x="78" y="164" font-size="14" font-weight="600" fill="#f1f5f9">Full-stack web apps</text>
<text x="78" y="182" font-size="12" fill="#94a3b8">Fast, secure, scalable front to back</text>
</g>
<g class="ab-row" style="animation-delay:.9s">
<rect x="24" y="204" width="392" height="52" rx="12" fill="#151726" stroke="#a78bfa" stroke-opacity="0.35"/>
<rect x="38" y="216" width="28" height="28" rx="8" fill="#a78bfa" fill-opacity="0.18"/>
<text x="46" y="236" font-size="15" fill="#a78bfa" class="ab-m">&#9998;</text>
<text x="78" y="226" font-size="14" font-weight="600" fill="#f1f5f9">UI/UX and interfaces</text>
<text x="78" y="244" font-size="12" fill="#94a3b8">Pixel-perfect, design-led development</text>
</g>
<g class="ab-row" style="animation-delay:1.4s">
<rect x="24" y="266" width="392" height="42" rx="12" fill="#151726" stroke="#f472b6" stroke-opacity="0.35"/>
<rect x="38" y="273" width="28" height="28" rx="8" fill="#f472b6" fill-opacity="0.18"/>
<text x="46" y="293" font-size="15" fill="#f472b6" class="ab-m">&#10022;</text>
<text x="78" y="292" font-size="14" font-weight="600" fill="#f1f5f9">AI agents and automation</text>
</g>
</g>
</g>

<!-- RIGHT: hobbies carousel (story style) -->
<g transform="translate(460,0)">
<rect x="0" y="0" width="440" height="330" rx="20" fill="#0d0e16"/>
<rect x="0" y="0" width="440" height="330" rx="20" fill="url(#ab-dots)"/>
<rect x="1" y="1" width="438" height="328" rx="19" fill="none" stroke="url(#ab-line)" stroke-opacity="0.65"/>
<text x="24" y="36" font-size="12" class="ab-m" fill="#f472b6">// outside the editor</text>
<!-- story progress bars -->
<g>
<rect x="24" y="52" width="122" height="4" rx="2" fill="#ffffff" fill-opacity="0.12"/>
<rect x="159" y="52" width="122" height="4" rx="2" fill="#ffffff" fill-opacity="0.12"/>
<rect x="294" y="52" width="122" height="4" rx="2" fill="#ffffff" fill-opacity="0.12"/>
<rect x="24" y="52" width="122" height="4" rx="2" fill="url(#ab-bar)"><animate attributeName="width" values="0;122;122;122;122" keyTimes="0;0.33;0.34;0.99;1" dur="12s" repeatCount="indefinite"/></rect>
<rect x="159" y="52" width="122" height="4" rx="2" fill="url(#ab-bar)"><animate attributeName="width" values="0;0;122;122;0" keyTimes="0;0.33;0.66;0.99;1" dur="12s" repeatCount="indefinite"/></rect>
<rect x="294" y="52" width="122" height="4" rx="2" fill="url(#ab-bar)"><animate attributeName="width" values="0;0;0;122;0" keyTimes="0;0.66;0.67;0.99;1" dur="12s" repeatCount="indefinite"/></rect>
</g>
<!-- slides -->
<g class="ab-f">
<g class="ab-s ab-s1" transform-origin="0 0">
<circle cx="220" cy="150" r="46" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="2"/>
<text x="220" y="165" text-anchor="middle" font-size="44">&#127918;</text>
<text x="220" y="236" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9">Gaming</text>
<text x="220" y="262" text-anchor="middle" font-size="13" fill="#94a3b8">[Edit me: your favourite games]</text>
</g>
<g class="ab-s ab-s2">
<circle cx="220" cy="150" r="46" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="2"/>
<text x="220" y="165" text-anchor="middle" font-size="44">&#127911;</text>
<text x="220" y="236" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9">Music</text>
<text x="220" y="262" text-anchor="middle" font-size="13" fill="#94a3b8">[Edit me: what you listen to]</text>
</g>
<g class="ab-s ab-s3">
<circle cx="220" cy="150" r="46" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.5" stroke-width="2"/>
<text x="220" y="165" text-anchor="middle" font-size="44">&#128161;</text>
<text x="220" y="236" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9">Side projects</text>
<text x="220" y="262" text-anchor="middle" font-size="13" fill="#94a3b8">Tinkering with new AI tools</text>
</g>
</g>
<!-- daily rings -->
<g transform="translate(24,296)" class="ab-m" font-size="11" fill="#94a3b8">
<text x="0" y="12">daily rings</text>
<rect x="90" y="3" width="90" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>
<rect x="90" y="3" width="90" height="8" rx="4" fill="#22d3ee"><animate attributeName="width" values="0;90;90;0" keyTimes="0;0.5;0.95;1" dur="6s" repeatCount="indefinite"/></rect>
<rect x="196" y="3" width="90" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>
<rect x="196" y="3" width="90" height="8" rx="4" fill="#a78bfa"><animate attributeName="width" values="0;68;68;0" keyTimes="0;0.5;0.95;1" dur="6s" repeatCount="indefinite"/></rect>
<rect x="302" y="3" width="90" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>
<rect x="302" y="3" width="90" height="8" rx="4" fill="#f472b6"><animate attributeName="width" values="0;80;80;0" keyTimes="0;0.5;0.95;1" dur="6s" repeatCount="indefinite"/></rect>
</g>
</g>
</svg>
