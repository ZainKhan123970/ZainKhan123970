<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" preserveAspectRatio="xMidYMid meet">
<defs>
<linearGradient id="cn-line" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<linearGradient id="cn-text" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<pattern id="cn-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#fff" fill-opacity="0.06"/></pattern>
<style>
.cn-f{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.cn-m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
.cn-bob{animation:cn-bb 2.4s ease-in-out infinite}
@keyframes cn-bb{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.cn-down{animation:cn-dn 1.2s ease-in-out infinite}
@keyframes cn-dn{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
.cn-spark{animation:cn-sp 2s ease-in-out infinite}
@keyframes cn-sp{0%,100%{opacity:.2}50%{opacity:1}}
</style>
</defs>
<rect width="900" height="200" rx="24" fill="#0d0e16"/>
<rect width="900" height="200" rx="24" fill="url(#cn-dots)"/>
<rect x="1" y="1" width="898" height="198" rx="23" fill="none" stroke="url(#cn-line)" stroke-opacity="0.65"/>

<g class="cn-bob">
<circle cx="140" cy="100" r="58" fill="#151726" stroke="url(#cn-line)" stroke-width="3"/>
<text x="140" y="116" text-anchor="middle" font-size="40" font-weight="800" class="cn-f" fill="#22d3ee">ZK</text>
<text class="cn-spark" x="70" y="48" font-size="18" fill="#fde68a">&#10022;</text>
<text class="cn-spark" x="210" y="56" font-size="14" fill="#a78bfa" style="animation-delay:.6s">&#10022;</text>
<text class="cn-spark" x="84" y="166" font-size="14" fill="#f472b6" style="animation-delay:1.1s">&#9825;</text>
</g>

<g class="cn-f">
<text x="270" y="78" font-size="13" class="cn-m" fill="#22d3ee">// let's connect</text>
<text x="270" y="116" font-size="38" font-weight="800" fill="url(#cn-text)">Let's work together</text>
<text x="270" y="148" font-size="16" fill="#94a3b8">Open to full-time and remote roles. Pick a link below.</text>
</g>
<g class="cn-down" stroke="#f472b6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M830 80 V130"/><path d="M812 114 L830 132 L848 114"/>
</g>
</svg>
