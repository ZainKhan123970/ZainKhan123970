<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
<defs>
<linearGradient id="cn-line" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<pattern id="cn-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#fff" fill-opacity="0.06"/></pattern>
<style>
.cn-f{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.cn-m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
.cn-bob{animation:cn-bb 2.4s ease-in-out infinite}
@keyframes cn-bb{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.cn-arrow{animation:cn-ar 1.2s ease-in-out infinite}
@keyframes cn-ar{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
.cn-card{opacity:0;animation:cn-in .7s both}
@keyframes cn-in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
.cn-spark{animation:cn-sp 2s ease-in-out infinite}
@keyframes cn-sp{0%,100%{opacity:.2}50%{opacity:1}}
</style>
</defs>
<rect width="900" height="260" rx="24" fill="#0d0e16"/>
<rect width="900" height="260" rx="24" fill="url(#cn-dots)"/>
<rect x="1" y="1" width="898" height="258" rx="23" fill="none" stroke="url(#cn-line)" stroke-opacity="0.65"/>

<!-- character: pointing monogram sticker -->
<g class="cn-bob">
<circle cx="150" cy="120" r="64" fill="#151726" stroke="url(#cn-line)" stroke-width="3"/>
<text x="150" y="136" text-anchor="middle" font-size="44" font-weight="800" class="cn-f" fill="#22d3ee">ZK</text>
<path d="M214 124 H262" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/>
<path d="M250 110 L270 124 L250 138" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="cn-arrow"/>
<text class="cn-spark" x="78" y="62" font-size="18" fill="#fde68a">&#10022;</text>
<text class="cn-spark" x="226" y="70" font-size="14" fill="#a78bfa" style="animation-delay:.6s">&#10022;</text>
<text class="cn-spark" x="92" y="196" font-size="14" fill="#f472b6" style="animation-delay:1.1s">&#9825;</text>
</g>
<text x="150" y="222" text-anchor="middle" font-size="14" font-weight="600" class="cn-f" fill="#e2e8f0">Let's work together</text>

<!-- link cards -->
<g class="cn-f">
<g class="cn-card" transform="translate(310,36)" style="animation-delay:.2s">
<rect width="270" height="72" rx="14" fill="#151726" stroke="#22d3ee" stroke-opacity="0.45"/>
<circle cx="38" cy="36" r="18" fill="#22d3ee" fill-opacity="0.15"/><text x="38" y="42" text-anchor="middle" font-size="16" fill="#22d3ee">&#9993;</text>
<text x="68" y="32" font-size="12" fill="#94a3b8">Email</text>
<text x="68" y="52" font-size="14" font-weight="600" fill="#f1f5f9">zainkhan972005@gmail.com</text>
</g>
<g class="cn-card" transform="translate(600,36)" style="animation-delay:.5s">
<rect width="270" height="72" rx="14" fill="#151726" stroke="#a78bfa" stroke-opacity="0.45"/>
<circle cx="38" cy="36" r="18" fill="#a78bfa" fill-opacity="0.15"/><text x="38" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#a78bfa" class="cn-m">&lt;/&gt;</text>
<text x="68" y="32" font-size="12" fill="#94a3b8">GitHub</text>
<text x="68" y="52" font-size="14" font-weight="600" fill="#f1f5f9">github.com/YOUR-USERNAME</text>
</g>
<g class="cn-card" transform="translate(310,124)" style="animation-delay:.8s">
<rect width="270" height="72" rx="14" fill="#151726" stroke="#f472b6" stroke-opacity="0.45"/>
<circle cx="38" cy="36" r="18" fill="#f472b6" fill-opacity="0.15"/><text x="38" y="42" text-anchor="middle" font-size="16" fill="#f472b6">&#9733;</text>
<text x="68" y="32" font-size="12" fill="#94a3b8">Portfolio</text>
<text x="68" y="52" font-size="14" font-weight="600" fill="#f1f5f9">zainkhan-portfolio.vercel.app</text>
</g>
<g class="cn-card" transform="translate(600,124)" style="animation-delay:1.1s">
<rect width="270" height="72" rx="14" fill="#151726" stroke="#34d399" stroke-opacity="0.45"/>
<circle cx="38" cy="36" r="18" fill="#34d399" fill-opacity="0.15"/><text x="38" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#34d399" class="cn-m">in</text>
<text x="68" y="32" font-size="12" fill="#94a3b8">LinkedIn</text>
<text x="68" y="52" font-size="14" font-weight="600" fill="#f1f5f9">in/zainulabideenkhan97</text>
</g>
</g>
<text x="310" y="232" font-size="12" class="cn-m" fill="#64748b">// open to full-time and remote roles</text>
</svg>
