<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<defs>
<linearGradient id="st-line" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<radialGradient id="st-core" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<pattern id="st-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#fff" fill-opacity="0.06"/></pattern>
<path id="st-o1" d="M0,-70 a150,70 0 1,0 0.01,0"/>
<path id="st-o2" d="M0,-70 a150,70 0 1,0 0.01,0"/>
<path id="st-o3" d="M0,-70 a150,70 0 1,0 0.01,0"/>
<style>
.st-f{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.st-m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
.st-core{animation:st-pu 3s ease-in-out infinite;transform-origin:225px 215px}
@keyframes st-pu{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.st-chip rect.st-b{animation:st-glow 6s ease-in-out infinite}
@keyframes st-glow{0%,100%{stroke-opacity:.25}12%{stroke-opacity:1}30%{stroke-opacity:.25}}
</style>
</defs>
<rect width="900" height="420" rx="24" fill="#0d0e16"/>
<rect width="900" height="420" rx="24" fill="url(#st-dots)"/>
<rect x="1" y="1" width="898" height="418" rx="23" fill="none" stroke="url(#st-line)" stroke-opacity="0.65"/>
<text x="32" y="44" font-size="12" class="st-m" fill="#22d3ee">// tech stack</text>
<text x="32" y="72" font-size="24" font-weight="700" class="st-f" fill="#f1f5f9">Tools I build with</text>

<!-- atom -->
<g transform="translate(225,225)">
<g transform="rotate(0)"><ellipse rx="150" ry="62" fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.5"/>
<g><circle r="9" fill="#22d3ee"><animateMotion dur="7s" repeatCount="indefinite" path="M-150,0 a150,62 0 1,0 300,0 a150,62 0 1,0 -300,0"/></circle></g></g>
<g transform="rotate(60)"><ellipse rx="150" ry="62" fill="none" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
<g><circle r="9" fill="#a78bfa"><animateMotion dur="9s" repeatCount="indefinite" path="M-150,0 a150,62 0 1,0 300,0 a150,62 0 1,0 -300,0"/></circle></g></g>
<g transform="rotate(120)"><ellipse rx="150" ry="62" fill="none" stroke="#f472b6" stroke-opacity="0.45" stroke-width="1.5"/>
<g><circle r="9" fill="#f472b6"><animateMotion dur="11s" repeatCount="indefinite" path="M-150,0 a150,62 0 1,0 300,0 a150,62 0 1,0 -300,0"/></circle></g></g>
</g>
<circle class="st-core" cx="225" cy="225" r="34" fill="url(#st-core)"/>
<circle cx="225" cy="225" r="20" fill="#0d0e16" stroke="url(#st-line)" stroke-width="2"/>
<text x="225" y="231" text-anchor="middle" font-size="16" font-weight="800" class="st-f" fill="#f1f5f9">&lt;/&gt;</text>

<!-- chip grid -->
<g class="st-f" font-size="13" font-weight="600">
<text x="480" y="108" font-size="11" class="st-m" fill="#64748b">FRONTEND</text>
<g class="st-chip" transform="translate(480,118)">
<rect class="st-b" width="86" height="32" rx="16" fill="#151726" stroke="#22d3ee" style="animation-delay:0s"/><text x="43" y="21" text-anchor="middle" fill="#e2e8f0">React</text>
</g>
<g class="st-chip" transform="translate(576,118)">
<rect class="st-b" width="86" height="32" rx="16" fill="#151726" stroke="#22d3ee" style="animation-delay:.4s"/><text x="43" y="21" text-anchor="middle" fill="#e2e8f0">Next.js</text>
</g>
<g class="st-chip" transform="translate(672,118)">
<rect class="st-b" width="110" height="32" rx="16" fill="#151726" stroke="#22d3ee" style="animation-delay:.8s"/><text x="55" y="21" text-anchor="middle" fill="#e2e8f0">TypeScript</text>
</g>
<g class="st-chip" transform="translate(792,118)">
<rect class="st-b" width="80" height="32" rx="16" fill="#151726" stroke="#22d3ee" style="animation-delay:1.2s"/><text x="40" y="21" text-anchor="middle" fill="#e2e8f0">HTML/CSS</text>
</g>

<text x="480" y="182" font-size="11" class="st-m" fill="#64748b">BACKEND AND DATA</text>
<g class="st-chip" transform="translate(480,192)">
<rect class="st-b" width="86" height="32" rx="16" fill="#151726" stroke="#a78bfa" style="animation-delay:1.6s"/><text x="43" y="21" text-anchor="middle" fill="#e2e8f0">Node.js</text>
</g>
<g class="st-chip" transform="translate(576,192)">
<rect class="st-b" width="86" height="32" rx="16" fill="#151726" stroke="#a78bfa" style="animation-delay:2s"/><text x="43" y="21" text-anchor="middle" fill="#e2e8f0">Python</text>
</g>
<g class="st-chip" transform="translate(672,192)">
<rect class="st-b" width="110" height="32" rx="16" fill="#151726" stroke="#a78bfa" style="animation-delay:2.4s"/><text x="55" y="21" text-anchor="middle" fill="#e2e8f0">REST APIs</text>
</g>
<g class="st-chip" transform="translate(792,192)">
<rect class="st-b" width="80" height="32" rx="16" fill="#151726" stroke="#a78bfa" style="animation-delay:2.8s"/><text x="40" y="21" text-anchor="middle" fill="#e2e8f0">SQL</text>
</g>

<text x="480" y="256" font-size="11" class="st-m" fill="#64748b">DESIGN, MOBILE AND AI</text>
<g class="st-chip" transform="translate(480,266)">
<rect class="st-b" width="86" height="32" rx="16" fill="#151726" stroke="#f472b6" style="animation-delay:3.2s"/><text x="43" y="21" text-anchor="middle" fill="#e2e8f0">Figma</text>
</g>
<g class="st-chip" transform="translate(576,266)">
<rect class="st-b" width="110" height="32" rx="16" fill="#151726" stroke="#f472b6" style="animation-delay:3.6s"/><text x="55" y="21" text-anchor="middle" fill="#e2e8f0">Tailwind</text>
</g>
<g class="st-chip" transform="translate(696,266)">
<rect class="st-b" width="86" height="32" rx="16" fill="#151726" stroke="#f472b6" style="animation-delay:4s"/><text x="43" y="21" text-anchor="middle" fill="#e2e8f0">Mobile</text>
</g>
<g class="st-chip" transform="translate(792,266)">
<rect class="st-b" width="80" height="32" rx="16" fill="#151726" stroke="#f472b6" style="animation-delay:4.4s"/><text x="40" y="21" text-anchor="middle" fill="#e2e8f0">AI Agents</text>
</g>
<g class="st-chip" transform="translate(480,310)">
<rect class="st-b" width="130" height="32" rx="16" fill="#151726" stroke="#f472b6" style="animation-delay:4.8s"/><text x="65" y="21" text-anchor="middle" fill="#e2e8f0">Automation</text>
</g>
<g class="st-chip" transform="translate(620,310)">
<rect class="st-b" width="86" height="32" rx="16" fill="#151726" stroke="#f472b6" style="animation-delay:5.2s"/><text x="43" y="21" text-anchor="middle" fill="#e2e8f0">Git</text>
</g>
</g>
<text x="480" y="384" font-size="11" class="st-m" fill="#64748b">// swap chips for your real stack in stack.svg</text>
</svg>
