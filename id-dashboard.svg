<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" preserveAspectRatio="xMidYMid meet">
<defs>
<linearGradient id="id-line" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<linearGradient id="id-holo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="id-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<linearGradient id="id-bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0.45"/></linearGradient>
<pattern id="id-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#fff" fill-opacity="0.06"/></pattern>
<clipPath id="id-cardclip"><rect x="0" y="0" width="190" height="270" rx="14"/></clipPath>
<style>
.id-f{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.id-m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
.id-swing{transform-origin:0 0;animation:id-sw 5s ease-in-out infinite}
@keyframes id-sw{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-5deg)}}
.id-bar{transform-box:fill-box;transform-origin:bottom;animation:id-gr 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes id-gr{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.id-pulse{animation:id-pu 1.8s ease-in-out infinite}
@keyframes id-pu{0%,100%{opacity:1}50%{opacity:.25}}
</style>
</defs>
<rect width="900" height="440" rx="24" fill="#0d0e16"/>
<rect width="900" height="440" rx="24" fill="url(#id-dots)"/>
<rect x="1" y="1" width="898" height="438" rx="23" fill="none" stroke="url(#id-line)" stroke-opacity="0.65"/>

<!-- lanyard + badge -->
<g transform="translate(150,0)">
<g class="id-swing">
<path d="M-26,0 L-8,118 M26,0 L8,118" stroke="#a78bfa" stroke-width="7" stroke-linecap="round"/>
<rect x="-14" y="112" width="28" height="20" rx="6" fill="url(#id-gold)"/>
<g transform="translate(-95,130)">
<rect width="190" height="270" rx="14" fill="#151726" stroke="url(#id-line)" stroke-width="2"/>
<g clip-path="url(#id-cardclip)">
<rect x="0" y="0" width="190" height="62" fill="url(#id-line)" fill-opacity="0.25"/>
<rect x="-80" y="0" width="60" height="270" fill="url(#id-holo)" transform="skewX(-18)">
<animate attributeName="x" values="-80;260;260" keyTimes="0;0.5;1" dur="3.4s" repeatCount="indefinite"/>
</rect>
</g>
<text x="95" y="26" text-anchor="middle" font-size="11" class="id-m" fill="#cbd5e1">CANDIDATE ID</text>
<circle cx="95" cy="112" r="40" fill="#0d0e16" stroke="url(#id-line)" stroke-width="3"/>
<text x="95" y="124" text-anchor="middle" font-size="34" font-weight="800" class="id-f" fill="#22d3ee">ZK</text>
<text x="95" y="180" text-anchor="middle" font-size="17" font-weight="700" class="id-f" fill="#f1f5f9">Zain ul Abideen</text>
<text x="95" y="200" text-anchor="middle" font-size="12" class="id-f" fill="#94a3b8">Full-Stack Developer</text>
<rect x="27" y="210" width="136" height="24" rx="12" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.6"/>
<circle class="id-pulse" cx="44" cy="222" r="4" fill="#34d399"/>
<text x="56" y="226" font-size="10.5" font-weight="700" letter-spacing="0.5" class="id-f" fill="#6ee7b7">OPEN TO WORK</text>
<g transform="translate(40,243)" fill="#94a3b8"><rect width="2" height="14"/><rect x="5" width="4" height="14"/><rect x="12" width="2" height="14"/><rect x="17" width="6" height="14"/><rect x="26" width="2" height="14"/><rect x="31" width="4" height="14"/><rect x="38" width="2" height="14"/><rect x="43" width="5" height="14"/><rect x="51" width="2" height="14"/><rect x="56" width="4" height="14"/><rect x="63" width="3" height="14"/><rect x="69" width="2" height="14"/><rect x="74" width="4" height="14"/></g>
<rect x="147" y="14" width="26" height="18" rx="4" fill="url(#id-gold)"/>
</g>
</g>
</g>

<!-- dashboard -->
<g transform="translate(300,36)" class="id-f">
<text x="0" y="14" font-size="12" class="id-m" fill="#22d3ee">// dashboard</text>
<!-- KPI tiles -->
<g>
<rect x="0" y="30" width="180" height="84" rx="14" fill="#151726" stroke="#22d3ee" stroke-opacity="0.4"/>
<text x="16" y="56" font-size="12" fill="#94a3b8">Projects shipped</text>
<text x="16" y="96" font-size="38" font-weight="800" fill="#f1f5f9"><tspan id="id-k1">50</tspan><tspan fill="#22d3ee">+</tspan></text>
<rect x="195" y="30" width="180" height="84" rx="14" fill="#151726" stroke="#a78bfa" stroke-opacity="0.4"/>
<text x="211" y="56" font-size="12" fill="#94a3b8">Clients worked with</text>
<text x="211" y="96" font-size="38" font-weight="800" fill="#f1f5f9">30<tspan fill="#a78bfa">+</tspan></text>
<rect x="390" y="30" width="180" height="84" rx="14" fill="#151726" stroke="#f472b6" stroke-opacity="0.4"/>
<text x="406" y="56" font-size="12" fill="#94a3b8">Core disciplines</text>
<text x="406" y="96" font-size="38" font-weight="800" fill="#f1f5f9">6<tspan fill="#f472b6">+</tspan></text>
</g>
<!-- bar chart: single hue -->
<g transform="translate(0,134)">
<rect width="360" height="190" rx="14" fill="#151726" stroke="#ffffff" stroke-opacity="0.08"/>
<text x="16" y="26" font-size="12" fill="#94a3b8">Work by area (share of projects)</text>
<g transform="translate(16,44)">
<g stroke="#ffffff" stroke-opacity="0.07"><line x1="0" y1="0" x2="328" y2="0"/><line x1="0" y1="45" x2="328" y2="45"/><line x1="0" y1="90" x2="328" y2="90"/></g>
<rect class="id-bar" x="14" y="0" width="42" height="90" rx="5" fill="url(#id-bar)" style="animation-delay:.1s"/>
<rect class="id-bar" x="84" y="40" width="42" height="50" rx="5" fill="url(#id-bar)" style="animation-delay:.25s"/>
<rect class="id-bar" x="154" y="60" width="42" height="30" rx="5" fill="url(#id-bar)" style="animation-delay:.4s"/>
<rect class="id-bar" x="224" y="70" width="42" height="20" rx="5" fill="url(#id-bar)" style="animation-delay:.55s"/>
<rect class="id-bar" x="294" y="80" width="34" height="10" rx="5" fill="url(#id-bar)" style="animation-delay:.7s"/>
<g font-size="10" fill="#94a3b8" text-anchor="middle"><text x="35" y="110">AI</text><text x="105" y="110">Web</text><text x="175" y="110">UI/UX</text><text x="245" y="110">Mobile</text><text x="311" y="110">Other</text></g>
<g font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle"><text x="35" y="-6">45%</text><text x="105" y="34">25%</text><text x="175" y="54">15%</text><text x="245" y="64">10%</text><text x="311" y="74">5%</text></g>
</g>
</g>
<!-- now panel -->
<g transform="translate(375,134)">
<rect width="195" height="190" rx="14" fill="#151726" stroke="#ffffff" stroke-opacity="0.08"/>
<text x="16" y="26" font-size="12" fill="#94a3b8">Right now</text>
<g font-size="13" fill="#e2e8f0">
<circle class="id-pulse" cx="22" cy="56" r="4" fill="#34d399"/><text x="36" y="60">Looking for a dev role</text>
<circle cx="22" cy="90" r="4" fill="#22d3ee"/><text x="36" y="94">Building AI agents</text>
<circle cx="22" cy="124" r="4" fill="#a78bfa"/><text x="36" y="128">Polishing UI/UX skills</text>
<circle cx="22" cy="158" r="4" fill="#f472b6"/><text x="36" y="162">Based in Karachi, PK</text>
</g>
</g>
</g>
</svg>
